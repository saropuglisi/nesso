<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nesso — Laboratorio</title>
    <meta
      name="description"
      content="Esplora e preregistra tesi con modelli locali o API."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2340564c'/%3E%3Cpath d='M10 28V12l20 16V12' stroke='white' stroke-width='4' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header>
      <button id="menuButton" aria-expanded="false" aria-controls="menu">
        ☰ <b>nesso</b></button
      ><span id="modelLabel">Configurazione…</span
      ><button id="settingsButton">Connessione</button>
    </header>
    <nav id="menu" hidden>
      <button id="newButton">＋ Nuova tesi</button
      ><button id="mapButton">Mappa</button
      ><button id="journalButton">Thinking Journal</button>
    </nav>
    <div class="toolbar">
      <span id="titleLabel">Il tuo laboratorio di pensiero</span
      ><span id="effortLabel"></span
      ><button id="reviseButton" disabled>Rivedi tesi</button
      ><button id="saveButton" disabled>Fissa criteri</button>
    </div>
    <main id="workspace">
      <div id="liveBar" hidden role="status">
        <span class="live-dot"></span><span id="liveMessage"></span
        ><button id="stopAnalysis">Interrompi</button
        ><button id="retryAnalysis" hidden>Riprova</button>
      </div>
      <div id="canvas">
        <button id="focusSummary" hidden aria-controls="inspector">
          <span class="eyebrow">IL PASSAGGIO DECISIVO · DA VERIFICARE</span
          ><span id="focusClaim"></span
          ><small>Perché conta e come metterlo alla prova ↗</small>
        </button>
        <div id="graph"></div>
        <div id="empty">
          <span class="eyebrow">DAL PENSIERO AI NESSI</span>
          <h1>Che cosa vuoi mettere alla prova?</h1>
          <p>
            Una tesi sui mercati, una decisione, un’idea.<br />Parti da una
            previsione e scopri che cosa deve essere vero.
          </p>
          <button class="primary" id="emptyNew">Scrivi una tesi →</button>
        </div>
      </div>
      <aside id="inspector" hidden></aside>
    </main>
    <section id="journal" hidden></section>
    <footer>
      <span id="status">Archivio locale · Nessuna analisi generata</span>
      <div>
        <button id="zoomOut" aria-label="Riduci">−</button
        ><span id="zoomLabel">100%</span
        ><button id="zoomIn" aria-label="Ingrandisci">＋</button
        ><button id="centerButton">Centra</button>
      </div>
    </footer>
    <dialog id="dialog"><div id="dialogContent"></div></dialog>
    <div id="toast" role="status"></div>
  </body>
</html>
